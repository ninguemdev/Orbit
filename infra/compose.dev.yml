# PostgreSQL de desenvolvimento. Credenciais apenas locais; não usar em produção.
name: orbit-dev
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit_dev_password
      POSTGRES_DB: orbit
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - orbit-postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orbit -d orbit']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  orbit-postgres:
